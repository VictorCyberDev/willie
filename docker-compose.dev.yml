services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: willie
      POSTGRES_PASSWORD: willie
      POSTGRES_DB: willie
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U willie"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["willie_pg:/var/lib/postgresql/data"]
volumes:
  willie_pg:
