name: Willie acceptance
on: [push, pull_request]
jobs:
  acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: willie, POSTGRES_PASSWORD: willie, POSTGRES_DB: willie_test}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://willie:willie@localhost:5432/willie_test
      DATABASE_URL: postgres://willie:willie@localhost:5432/willie_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm test:property && pnpm test:integration && pnpm test:contracts && pnpm build && pnpm test:e2e && pnpm test:m9 && pnpm docker:build
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: browser-evidence, path: test-results}
