name: Willie acceptance
on: [push, pull_request]
jobs:
  acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: willie, POSTGRES_PASSWORD: willie, POSTGRES_DB: willie_test}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://willie:willie@localhost:5432/willie_test
      DATABASE_URL: postgres://willie:willie@localhost:5432/willie_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Migrate and seed
        run: pnpm migrate && pnpm seed
      - name: Lint
        shell: bash
        run: |
          mkdir -p test-results
          set +e
          pnpm exec eslint . --max-warnings=0 -f json > test-results/lint.json
          status=$?
          set -e
          exit $status
      - name: Typecheck
        shell: bash
        run: |
          mkdir -p test-results
          set +e
          pnpm typecheck > test-results/typecheck.txt 2>&1
          status=$?
          cat test-results/typecheck.txt
          set -e
          exit $status
      - name: Unit tests
        run: pnpm test
      - name: Property tests
        run: pnpm test:property
      - name: Integration tests
        run: pnpm test:integration
      - name: Contract tests
        run: pnpm test:contracts
      - name: Build
        run: pnpm build
      - name: Browser E2E
        run: pnpm test:e2e
      - name: M9 acceptance
        run: pnpm test:m9
      - name: Failure and restart acceptance
        run: pnpm test:failure
      - name: Docker build
        run: pnpm docker:build
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: browser-evidence, path: test-results}
